name: CI

on:
  push:
    branches: [main, claude/**, codex/**]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MusicLibrary.sln

      - name: Build
        run: dotnet build MusicLibrary.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MusicLibrary.Tests/MusicLibrary.Tests.csproj --configuration Release --no-build --filter "Category!=Benchmark" --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none --logger "trx" --results-directory TestResults

      - name: Validate Windows publication
        shell: pwsh
        run: ./scripts/build-release.ps1 -PublishOnly

      - name: Search benchmark (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: dotnet test MusicLibrary.Tests/MusicLibrary.Tests.csproj --configuration Release --no-build --filter "Category=Benchmark" --logger "trx;LogFileName=benchmark.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
